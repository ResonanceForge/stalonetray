name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Title
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            ci
            docs
            build
